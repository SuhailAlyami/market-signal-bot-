name: Asia watcher CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: pip install -r requirements.txt -r requirements-ibkr.txt
      - name: Full syntax and unit regression (not predictive validation)
        run: |
          python -m compileall -q *.py tests
          python -m unittest discover -s tests -p 'test_*.py' -v

