name: Direction-wave protocol tests
on:
  pull_request:
    paths:
      - 'research/direction_wave_20261104/**'
      - '.github/workflows/direction_wave_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protocol test dependencies
        run: pip install pandas numpy exchange_calendars
      - name: Run capture-time and adoption tests
        working-directory: research/direction_wave_20261104
        run: python -m unittest test_protocol.py
