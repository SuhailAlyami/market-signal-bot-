name: Suhail regression and historical smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and regression dependencies
        run: pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-research.txt
      - name: Compile all application modules and regression fixtures
        run: python -m compileall -q *.py tests
      - name: Full deterministic regression suite (not predictive validation)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  historical-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install IBKR application dependencies
        run: pip install -r requirements.txt
      - name: Offline historical detector regression, no account access in PR CI
        run: python -m unittest discover -s tests -p 'test_backtest_explosion.py' -v
