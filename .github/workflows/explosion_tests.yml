name: Suhail regression and historical smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and regression dependencies
        run: pip install -r requirements.txt -r requirements-ibkr.txt -r requirements-research.txt
      - name: Compile all application modules and regression fixtures
        run: python -m compileall -q *.py tests
      - name: Full deterministic regression suite (not predictive validation)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  historical-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical study dependencies
        run: pip install 'yfinance>=0.2.55,<1' 'pandas>=2.1,<3' 'requests>=2.31,<3' 'pandas-market-calendars>=4.4,<6'
      - name: Historical availability smoke only (not predictive validation)
        run: python backtest_explosion.py --symbol SPY --period 5d --horizon 6 --output backtest_results.json
      - name: Save research-only result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suhail-spy-research-report
          path: backtest_results.json
          if-no-files-found: ignore

