name: Suhail Cloud WATCH — 5 minute primary
on:
  workflow_dispatch:
  schedule:
    # UTC; Asia Globex begins Sun-Thu 22/23 UTC (US DST), and Tokyo afternoon ends ~06 UTC.
    - cron: '*/5 21-23 * * 0-4'
    - cron: '*/5 0-6 * * 1-5'
    # US cash market between 13:30-21:00 UTC depending on DST.
    - cron: '*/5 13-21 * * 1-5'

permissions:
  contents: read
  issues: write

concurrency:
  group: suhail-cloud-watch-issues
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: pip install 'yfinance>=0.2.55,<1' 'pandas>=2.1,<3' 'requests>=2.31,<3' 'pandas-market-calendars>=4.4,<6'
      - name: Save qualifying signals as issues — no trading
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python cloud_scan.py
