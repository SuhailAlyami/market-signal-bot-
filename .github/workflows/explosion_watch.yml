name: Suhail Hunter shadow — best effort, no alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

concurrency:
  group: suhail-hunter-shadow
  cancel-in-progress: false

jobs:
  shadow:
    # Authorized hosts use the single continuous NY job instead of duplicate polls.
    if: vars.IBKR_RUNNER == ''
    runs-on: ${{ vars.IBKR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Cache survival is best effort; this is not a durable live trading store.
      - uses: actions/cache/restore@v4
        with:
          path: .hunter-state
          key: hunter-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hunter-shadow-
      - name: Check IBKR runtime authorization, no implicit login
        id: ibkr
        run: python ibkr_feed_preflight.py
      - name: Record all candidates or explicit feed rejection, no outbound alerts
        if: steps.ibkr.outputs.ready == 'true' 
        run: python cloud_scan.py
      - name: Observe frozen NY candidates during the session, actual receipt times
        if: always() && steps.ibkr.outputs.ready == 'true'
        run: python ny_intraday_shadow.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .hunter-state
          key: hunter-shadow-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-shadow-${{ github.run_id }}
          path: .hunter-state/
          include-hidden-files: true
          if-no-files-found: warn

