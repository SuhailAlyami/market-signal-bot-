name: Suhail Cloud WATCH — 5 minute primary
on:
  workflow_dispatch:
  schedule:
    # Every five minutes, including Globex Europe and late New York; scanner skips closed sessions.
    # GitHub scheduled jobs are best-effort and may be delayed or dropped.
    - cron: '*/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: suhail-cloud-watch-issues
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install scanner dependencies
        run: pip install 'yfinance>=0.2.55,<1' 'pandas>=2.1,<3' 'requests>=2.31,<3' 'pandas-market-calendars>=4.4,<6'
      - name: Save qualifying signals as issues — no trading
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python cloud_scan.py
