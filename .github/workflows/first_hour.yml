name: first-hour
# SPX update after the first hour (10:30 New York): projected day high/low and rest-of-day big-move risk
# (range_alert/first_hour.py, out-of-sample validated). Two slots cover EST and EDT; the script only sends between
# 10:32 and 12:30 New York and the cache key sends once per day.
on:
  schedule:
    - cron: '40 14 * * 1-5'   # 10:40 NY in summer (EDT)
    - cron: '40 15 * * 1-5'   # 10:40 NY in winter (EST)
  workflow_dispatch:
permissions:
  contents: write   # only to store the sent forecast on branch data/daily-calls (scored in the evening)
  issues: write     # notification fallback when Telegram fails
concurrency:
  group: first-hour
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: day
        run: echo "ny=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - id: sent
        uses: actions/cache/restore@v4
        with:
          path: .first-hour-sent
          key: first-hour-${{ steps.day.outputs.ny }}
      - uses: actions/setup-python@v5
        if: steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - if: steps.sent.outputs.cache-hit != 'true'
        run: pip install exchange_calendars==4.13.2
      - if: steps.sent.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Fallback chain when Telegram fails: GitHub issue, then email if SMTP secrets exist (range_alert/notify_chain.py)
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_NOTIFY: ${{ vars.TELEGRAM_NOTIFY || 'on' }}
        run: |
          python range_alert/first_hour.py | tee out.txt
          grep -q -E 'TELEGRAM_OK|NO_SESSION_TODAY|LATE_NOT_SENT' out.txt && echo ok > .first-hour-sent || true
      - name: Store the sent forecast (data branch)
        if: steps.sent.outputs.cache-hit != 'true' && hashFiles('out.txt') != ''
        shell: bash
        run: |
          grep -q TELEGRAM_OK out.txt || exit 0
          line=$(grep '^FIRST_HOUR_JSON ' out.txt | head -1 | cut -d' ' -f2-); [ -n "$line" ] || exit 0
          session=$(python -c "import json,sys; print(json.loads(sys.argv[1])['session'])" "$line")
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch data/daily-calls "$url" calls-repo || { mkdir calls-repo && cd calls-repo && git init -q -b data/daily-calls && git remote add origin "$url" && cd ..; }
          mkdir -p calls-repo/firsthour && echo "$line" > "calls-repo/firsthour/$session.json"
          cd calls-repo && git config user.name "first-hour" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -q -m "first-hour $session")
          for i in 1 2 3; do git push -q origin HEAD:refs/heads/data/daily-calls && break; git pull -q --rebase origin data/daily-calls || true; sleep 5; done
      - if: steps.sent.outputs.cache-hit != 'true' && hashFiles('.first-hour-sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .first-hour-sent
          key: first-hour-${{ steps.day.outputs.ny }}
