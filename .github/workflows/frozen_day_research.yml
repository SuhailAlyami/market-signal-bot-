name: Frozen detector forward-day research — no alerts
on:
  workflow_dispatch:
  schedule:
    - cron: '35 21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: frozen-detector-forward-day
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline research dependencies
        run: pip install 'pandas>=2.1,<3' 'numpy>=1.24,<3' 'yfinance>=0.2.55,<1' 'pandas-market-calendars>=4.4,<6' -r requirements-research.txt
      - name: Evaluate fixed candidates on the newly closed session without retuning
        run: python frozen_day_research.py --output forward-day
      - name: Retain raw downloads and all positive or negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-detector-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward-day/
          retention-days: 30
          if-no-files-found: warn
