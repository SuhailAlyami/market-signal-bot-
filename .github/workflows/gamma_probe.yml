name: gamma-probe
on:
  workflow_dispatch:
  push:
    branches: [feat/gamma-radar-20261119]
    paths: ['gamma_radar/**', '.github/workflows/gamma_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python gamma_radar/radar.py
