name: NY IBKR continuous research — no alerts
on:
  workflow_dispatch:
  schedule:
    # Before NY open in summer and winter; calendar inside the program handles DST.
    - cron: '25 13 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ibkr-continuous-ny
  cancel-in-progress: false
jobs:
  session:
    # No private brokerage session is installed or assumed on hosted CI machines.
    if: github.ref == 'refs/heads/main' && vars.IBKR_RUNNER != ''
    runs-on: ${{ vars.IBKR_RUNNER }}
    timeout-minutes: 490
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Check same-host IBKR authorization
        id: ibkr
        run: python ibkr_feed_preflight.py
      - name: Observe every minute until NY close, no orders or alerts
        if: steps.ibkr.outputs.ready == 'true'
        run: python hunter_session.py --interval 60 --max-hours 8
      - name: Retain market-data research and explicit connection status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-ny-${{ github.run_id }}
          path: .hunter-state/
          include-hidden-files: true
          retention-days: 30
