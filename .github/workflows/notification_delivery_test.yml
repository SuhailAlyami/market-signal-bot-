name: Suhail iPhone notification delivery test
on:
  push:
    paths:
      - '.github/workflows/notification_delivery_test.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notification-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create notification from GitHub Actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "[Suhail TEST] إشعار تجريبي من GitHub Actions — لا تداول" \
            --body "🔔 هذا اختبار وصول إشعارات الآيفون من حساب github-actions[bot]، وليس إشارة سوق أو توصية تداول. @SuhailAlyami" \
            --assignee SuhailAlyami
