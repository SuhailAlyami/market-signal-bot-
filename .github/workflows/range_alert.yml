name: range-alert
# Daily pre-open SPX range alert to Telegram. Two slots (4 until 2026-11-24; cut to save Actions minutes) because GitHub schedules can run hours late;
# the cache key makes only the first successful run of each New York day send.
on:
  schedule:
    - cron: '13 10 * * 1-5'   # 13:13 Riyadh
    - cron: '13 11 * * 1-5'   # 14:13 Riyadh
  workflow_dispatch:
    inputs:
      force:
        description: 'Send for the next session even if today is not a trading day'
        type: boolean
        default: false
permissions:
  issues: write     # notification fallback when Telegram fails
  contents: write   # only to store each sent call on branch data/daily-calls (scored in the evening)
concurrency:
  group: range-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: day
        run: echo "ny=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - id: sent
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: .range-alert-sent
          key: range-alert-${{ steps.day.outputs.ny }}
      - uses: actions/setup-python@v5
        if: steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - if: steps.sent.outputs.cache-hit != 'true'
        run: pip install exchange_calendars==4.13.2
      - name: Gamma radar snapshot (optional, experimental)
        if: steps.sent.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python gamma_radar/radar.py gamma.json && echo "GAMMA_JSON=$PWD/gamma.json" >> "$GITHUB_ENV"
      - name: Latest retrained explosion model (optional)
        if: steps.sent.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch data/explosion-model "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" model-data \
            && echo "EXPLOSION_MODEL=$PWD/model-data/explosion_model.json" >> "$GITHUB_ENV" || echo "using committed model"
      - if: steps.sent.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Fallback chain when Telegram fails: GitHub issue, then email if SMTP secrets exist (range_alert/notify_chain.py)
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TELEGRAM_NOTIFY: ${{ vars.TELEGRAM_NOTIFY || 'on' }}   # owner wants messages (2026-11-20); repo variable 'off' silences
        run: |
          python range_alert/daily_range.py ${{ inputs.force && '--force' || '' }} | tee out.txt
          grep -q -E 'TELEGRAM_OK|NO_SESSION_TODAY' out.txt && echo ok > .range-alert-sent || true
      - name: Store the sent call (data branch)
        if: ${{ !inputs.force && steps.sent.outputs.cache-hit != 'true' && hashFiles('out.txt') != '' }}   # forced resends are never scored
        shell: bash
        run: |
          grep -q TELEGRAM_OK out.txt || exit 0
          line=$(grep '^CALL_JSON ' out.txt | head -1 | cut -d' ' -f2-); [ -n "$line" ] || exit 0
          session=$(python -c "import json,sys; print(json.loads(sys.argv[1])['session'])" "$line")
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads "$url" data/daily-calls >/dev/null; then git clone -q --depth 1 --branch data/daily-calls "$url" calls-repo
          else mkdir calls-repo && cd calls-repo && git init -q -b data/daily-calls && git remote add origin "$url" && cd ..; fi
          mkdir -p calls-repo/calls && echo "$line" > "calls-repo/calls/$session.json"
          cd calls-repo && git config user.name "range-alert" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -q -m "call $session") && git push -q origin HEAD:refs/heads/data/daily-calls
      - if: ${{ !inputs.force && steps.sent.outputs.cache-hit != 'true' && hashFiles('.range-alert-sent') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .range-alert-sent
          key: range-alert-${{ steps.day.outputs.ny }}
