name: range-evaluate
# Post-close Telegram check of the pre-open range alert. Several slots because GitHub schedules can run late;
# the cache key is the evaluated session, so a late or next-morning run delivers a missed result exactly once.
on:
  schedule:
    - cron: '37 21 * * 1-5'   # 00:37 Riyadh
    - cron: '37 22 * * 1-5'   # 01:37 Riyadh
    - cron: '37 23 * * 1-5'   # 02:37 Riyadh
    - cron: '37 1 * * 2-6'    # 04:37 Riyadh
  workflow_dispatch:
    inputs:
      force:
        description: 'Evaluate the latest completed session even if it is not today'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: range-evaluate
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install exchange_calendars==4.13.2
      - id: day   # the session being evaluated (latest closed one): one delivery per session
        run: echo "ny=$(python range_alert/evaluate_range.py --print-target)" >> "$GITHUB_OUTPUT"
      - id: sent
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v4
        with:
          path: .range-eval-sent
          key: range-eval-${{ steps.day.outputs.ny }}
      - name: Stored morning calls (read-only)
        if: steps.sent.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch data/daily-calls "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" calls-data || echo "no stored calls"
      - if: steps.sent.outputs.cache-hit != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLS_DIR: calls-data/calls
        shell: bash
        run: |
          set -o pipefail
          python range_alert/evaluate_range.py ${{ inputs.force && '--force' || '' }} | tee out.txt
          if grep -q 'TELEGRAM_OK' out.txt; then echo ok > .range-eval-sent; fi
      - if: ${{ steps.sent.outputs.cache-hit != 'true' && hashFiles('.range-eval-sent') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .range-eval-sent
          key: range-eval-${{ steps.day.outputs.ny }}
