name: spx-collect
# Research data collection only: no alerts, no orders, no secrets. Classification of the data is DELAYED_RESEARCH_ONLY.
# Schedule: 21:45 UTC Mon-Fri = 00:45 Asia/Riyadh (Tue-Sat), i.e. 45 min after the NYSE close in winter (21:00 UTC)
# and 1 h 45 min after it in summer (20:00 UTC). Scheduled runs are best effort and may be delayed by GitHub.
# Yahoo serves only the last 7 trading days of 1-minute bars, so a missed run is recoverable for about a week.
on:
  pull_request:
    paths:
      - 'research/spx_collection/**'
      - 'research/breadth_20261109/**'
      - 'research/objective_review_20261107/**'
      - '.github/workflows/spx_collect.yml'
  schedule:
    - cron: '45 21 * * 1-5'
  workflow_dispatch:
    inputs:
      data_branch:
        description: 'Existing branch that stores collected data (must start with data/)'
        required: false
        default: 'data/spx-collection'
      breadth_range:
        description: 'Yahoo range for the 5m breadth fetch (5d daily; 60d only for a one-time backfill)'
        required: false
        default: '5d'
        type: choice
        options: ['5d', '1mo', '60d']
permissions: {}
concurrency:
  # One writer at a time for all data runs; PR test runs only serialize per ref.
  group: ${{ github.event_name == 'pull_request' && format('spx-collect-pr-{0}', github.ref) || 'spx-collect-data' }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/spx_collection/requirements.txt
      - run: pip install -r research/spx_collection/requirements.txt
      - run: python -m unittest test_collect -v
        working-directory: research/spx_collection
      - name: Frozen breadth screen input separation (development fixture + synthetic only)
        run: python -m unittest test_forward -v
        working-directory: research/breadth_20261109

  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # only to push the data branch; code checkout below does not persist credentials
    env:
      DATA_BRANCH: ${{ inputs.data_branch || 'data/spx-collection' }}
    steps:
      - name: Refuse data branches outside data/
        shell: bash
        run: |
          case "$DATA_BRANCH" in
            data/*) ;;
            *) echo "DATA_BRANCH must start with data/ (got: $DATA_BRANCH)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated checkout of the existing data branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_branch || 'data/spx-collection' }}
          path: data-repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/spx_collection/requirements.txt
      - run: pip install -r research/spx_collection/requirements.txt
      - name: Collector tests
        run: python -m unittest test_collect
        working-directory: research/spx_collection
      - name: Fetch, validate, store
        shell: bash
        run: |
          python research/spx_collection/collect_yahoo_spx.py --out data-repo | tee collect.out
          { echo '### SPX collection'; echo '```json'; cat collect.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch, validate, store 5m bars for SPX and the ten breadth stocks
        id: breadth
        continue-on-error: true
        shell: bash
        env:
          BREADTH_RANGE: ${{ inputs.breadth_range || '5d' }}
        run: |
          python research/spx_collection/collect_yahoo_spx.py --out data-repo --breadth --breadth-range "$BREADTH_RANGE" | tee breadth.out
          { echo '### Breadth 5m collection'; echo '```json'; cat breadth.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist to the data branch (fast-forward only, no force)
        shell: bash
        working-directory: data-repo
        run: |
          git config user.name "spx-collect"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to persist (duplicate payload or no change)."
          else
            git commit -m "SPX 1m snapshot $(date -u +%Y%m%dT%H%M%SZ) [run ${GITHUB_RUN_ID}]"
            git push origin "HEAD:refs/heads/${DATA_BRANCH}"
          fi
          test "$(git ls-remote origin "refs/heads/${DATA_BRANCH}" | cut -f1)" = "$(git rev-parse HEAD)"
          echo "Remote ${DATA_BRANCH} = $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit stored sessions against the XNYS calendar
        shell: bash   # bash -eo pipefail: a failed audit must not be masked by tee
        run: python research/spx_collection/collect_yahoo_spx.py --out data-repo --verify | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit breadth synchronization (all 11 symbols per session)
        shell: bash
        run: |
          python research/spx_collection/collect_yahoo_spx.py --out data-repo --verify-breadth | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail visibly if any breadth symbol fetch failed
        if: steps.breadth.outcome == 'failure'
        run: |
          echo "Breadth collection had failures; data that was fetched is stored, missing symbols are listed above."
          exit 1
